<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>لعبة الطيران</title>
<style>
  body { margin: 0; background: #050818; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== حالة اللعبة =====
let state = 'menu'; // menu, playing, levelup, gameover, win
let score = 0;
let level = 1;
let lives = 3;
let frame = 0;
let levelTimer = 0;
let bannerTimer = 0;

const LEVELS = [
  { name: 'المرحلة 1: السماء الهادية', spawn: 70, speed: 2.0, goal: 10, boss: false },
  { name: 'المرحلة 2: عاصفة النيازك', spawn: 55, speed: 2.8, goal: 18, boss: false },
  { name: 'المرحلة 3: حزام الكويكبات', spawn: 42, speed: 3.6, goal: 28, boss: false },
  { name: 'المرحلة 4: معركة الزعيم', spawn: 9999, speed: 3, goal: 0, boss: true }
];

// ===== الكائنات =====
const player = { x: canvas.width / 2, y: canvas.height - 100, w: 40, h: 50, targetX: canvas.width / 2, targetY: canvas.height - 100 };
let bullets = [];
let enemies = [];
let enemyBullets = [];
let particles = [];
let stars = [];
let powerups = [];
let boss = null;
let killsThisLevel = 0;
let shield = 0;
let doubleShot = 0;

for (let i = 0; i < 80; i++) {
  stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 0.5 });
}

// ===== التحكم =====
function setTarget(x, y) {
  player.targetX = x;
  player.targetY = Math.min(y - 60, canvas.height - 50);
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleTap();
  setTarget(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  setTarget(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('mousemove', e => setTarget(e.clientX, e.clientY + 60));
canvas.addEventListener('click', handleTap);

function handleTap() {
  if (state === 'menu' || state === 'gameover' || state === 'win') startGame();
}

function startGame() {
  score = 0; level = 1; lives = 3; killsThisLevel = 0;
  bullets = []; enemies = []; enemyBullets = []; particles = []; powerups = [];
  boss = null; shield = 0; doubleShot = 0;
  player.x = canvas.width / 2; player.y = canvas.height - 100;
  player.targetX = player.x; player.targetY = player.y;
  beginLevel();
}

function beginLevel() {
  state = 'levelup';
  bannerTimer = 120;
  killsThisLevel = 0;
  enemies = []; enemyBullets = []; bullets = [];
  const L = LEVELS[level - 1];
  if (L.boss) {
    boss = { x: canvas.width / 2, y: -100, w: 140, h: 90, hp: 60, maxHp: 60, dir: 1, shootTimer: 0 };
  } else {
    boss = null;
  }
}

// ===== إنشاء الأعداء =====
function spawnEnemy() {
  const L = LEVELS[level - 1];
  const type = Math.random() < 0.25 + level * 0.08 ? 'shooter' : 'normal';
  enemies.push({
    x: Math.random() * (canvas.width - 60) + 30,
    y: -40,
    w: 36, h: 36,
    vx: (Math.random() - 0.5) * (1 + level * 0.5),
    vy: L.speed * (0.8 + Math.random() * 0.5),
    type,
    hp: type === 'shooter' ? 2 : 1,
    shootTimer: Math.random() * 90
  });
}

function explode(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 30 + Math.random() * 20,
      color
    });
  }
}

function hit(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function hurtPlayer() {
  if (shield > 0) return;
  lives--;
  shield = 90;
  explode(player.x, player.y, '#ff6b6b', 25);
  if (lives <= 0) state = 'gameover';
}

// ===== التحديث =====
function update() {
  frame++;

  // نجوم الخلفية
  stars.forEach(s => {
    s.y += s.s * (1 + level * 0.3);
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
  });

  if (state === 'levelup') {
    bannerTimer--;
    if (bannerTimer <= 0) state = 'playing';
  }
  if (state !== 'playing' && state !== 'levelup') return;

  // حركة الطيارة
  player.x += (player.targetX - player.x) * 0.2;
  player.y += (player.targetY - player.y) * 0.2;
  if (shield > 0) shield--;
  if (doubleShot > 0) doubleShot--;

  if (state !== 'playing') return;

  // إطلاق النار
  if (frame % 12 === 0) {
    if (doubleShot > 0) {
      bullets.push({ x: player.x - 12, y: player.y - 25, w: 5, h: 16 });
      bullets.push({ x: player.x + 12, y: player.y - 25, w: 5, h: 16 });
    } else {
      bullets.push({ x: player.x, y: player.y - 25, w: 5, h: 16 });
    }
  }
  bullets.forEach(b => b.y -= 10);
  bullets = bullets.filter(b => b.y > -20);

  const L = LEVELS[level - 1];

  // إنشاء أعداء
  if (!L.boss && frame % L.spawn === 0) spawnEnemy();

  // تحديث الأعداء
  enemies.forEach(e => {
    e.x += e.vx; e.y += e.vy;
    if (e.x < 20 || e.x > canvas.width - 20) e.vx *= -1;
    if (e.type === 'shooter') {
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < canvas.height * 0.6) {
        e.shootTimer = 100 - level * 10;
        enemyBullets.push({ x: e.x, y: e.y + 20, w: 8, h: 8, vx: 0, vy: 4 + level * 0.5 });
      }
    }
  });

  // اصطدام رصاص اللاعب بالأعداء
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (!b.dead && !e.dead && hit(b, e)) {
        b.dead = true;
        e.hp--;
        if (e.hp <= 0) {
          e.dead = true;
          score += e.type === 'shooter' ? 30 : 10;
          killsThisLevel++;
          explode(e.x, e.y, '#ffd93d', 14);
          if (Math.random() < 0.12) {
            powerups.push({ x: e.x, y: e.y, w: 22, h: 22, kind: Math.random() < 0.5 ? 'shield' : 'double' });
          }
        }
      }
    });
    if (boss && !b.dead && hit(b, boss) && boss.y > 40) {
      b.dead = true;
      boss.hp--;
      explode(b.x, b.y, '#ff9f43', 3);
      if (boss.hp <= 0) {
        score += 500;
        explode(boss.x, boss.y, '#ff6b6b', 80);
        boss = null;
        state = 'win';
      }
    }
  });
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead && e.y < canvas.height + 50);

  // اصطدام الأعداء باللاعب
  enemies.forEach(e => {
    if (!e.dead && hit(player, { x: e.x, y: e.y, w: e.w - 6, h: e.h - 6 })) {
      e.dead = true;
      explode(e.x, e.y, '#ff6b6b', 12);
      hurtPlayer();
    }
  });

  // رصاص الأعداء
  enemyBullets.forEach(b => {
    b.x += b.vx; b.y += b.vy;
    if (hit(player, b)) { b.dead = true; hurtPlayer(); }
  });
  enemyBullets = enemyBullets.filter(b => !b.dead && b.y < canvas.height + 20 && b.x > -20 && b.x < canvas.width + 20);

  // المكافآت
  powerups.forEach(p => {
    p.y += 2;
    if (hit(player, p)) {
      p.dead = true;
      if (p.kind === 'shield') shield = 300;
      else doubleShot = 600;
    }
  });
  powerups = powerups.filter(p => !p.dead && p.y < canvas.height + 20);

  // الزعيم
  if (boss) {
    if (boss.y < 80) boss.y += 1.5;
    else {
      boss.x += boss.dir * 2.5;
      if (boss.x > canvas.width - 80 || boss.x < 80) boss.dir *= -1;
      boss.shootTimer--;
      if (boss.shootTimer <= 0) {
        boss.shootTimer = 45;
        for (let i = -2; i <= 2; i++) {
          enemyBullets.push({ x: boss.x, y: boss.y + 40, w: 9, h: 9, vx: i * 1.3, vy: 4 });
        }
      }
    }
    if (hit(player, boss)) hurtPlayer();
  }

  // جسيمات
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // الانتقال للمرحلة التالية
  if (!L.boss && killsThisLevel >= L.goal) {
    level++;
    beginLevel();
  }
}

// ===== الرسم =====
function drawPlane(x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - 28);
  ctx.lineTo(x + 22, y + 22);
  ctx.lineTo(x + 8, y + 14);
  ctx.lineTo(x, y + 24);
  ctx.lineTo(x - 8, y + 14);
  ctx.lineTo(x - 22, y + 22);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // الخلفية
  stars.forEach(s => {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.s / 3) + ')';
    ctx.fillRect(s.x, s.y, s.s, s.s * 2);
  });

  if (state === 'menu') {
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('لعبة الطيران', canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '22px sans-serif';
    ctx.fillText('المس الشاشة لتبدأ', canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillText('4 مراحل وزعيم في النهاية', canvas.width / 2, canvas.height / 2 + 50);
    return;
  }

  // مكافآت
  powerups.forEach(p => {
    ctx.fillStyle = p.kind === 'shield' ? '#4ecdc4' : '#a29bfe';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.kind === 'shield' ? 'S' : '2', p.x, p.y + 5);
  });

  // أعداء
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(Math.PI);
    drawPlane(0, 0, e.type === 'shooter' ? '#ff6b6b' : '#ff9f43');
    ctx.restore();
  });

  // الزعيم
  if (boss) {
    ctx.fillStyle = '#e84393';
    ctx.fillRect(boss.x - boss.w / 2, boss.y - boss.h / 2, boss.w, boss.h);
    ctx.fillStyle = '#6c1d45';
    ctx.fillRect(boss.x - 30, boss.y - 10, 60, 30);
    ctx.fillStyle = '#333';
    ctx.fillRect(canvas.width / 2 - 100, 12, 200, 12);
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(canvas.width / 2 - 100, 12, 200 * (boss.hp / boss.maxHp), 12);
  }

  // رصاص
  ctx.fillStyle = '#7bed9f';
  bullets.forEach(b => ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h));
  ctx.fillStyle = '#ff4757';
  enemyBullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // اللاعب
  if (state !== 'gameover') {
    if (shield > 0) {
      ctx.strokeStyle = 'rgba(78,205,196,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, 34, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (shield % 10 < 5 || shield > 200) drawPlane(player.x, player.y, '#74b9ff');
  }

  // جسيمات
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life / 50, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;

  // واجهة اللاعب
  ctx.fillStyle = 'white';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('النقاط: ' + score, 12, 30);
  ctx.textAlign = 'right';
  ctx.fillText('الحياة: ' + '❤'.repeat(Math.max(lives, 0)), canvas.width - 12, 30);
  const L = LEVELS[Math.min(level, LEVELS.length) - 1];
  if (!L.boss) {
    ctx.textAlign = 'center';
    ctx.font = '16px sans-serif';
    ctx.fillText(killsThisLevel + ' / ' + L.goal, canvas.width / 2, 30);
  }

  // لافتة المرحلة
  if (state === 'levelup') {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, canvas.height / 2 - 50, canvas.width, 90);
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(L.name, canvas.width / 2, canvas.height / 2 + 5);
  }

  if (state === 'gameover' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = state === 'win' ? '#7bed9f' : '#ff6b6b';
    ctx.font = 'bold 38px sans-serif';
    ctx.fillText(state === 'win' ? 'فزت! هزمت الزعيم' : 'خسرت', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = 'white';
    ctx.font = '22px sans-serif';
    ctx.fillText('نقاطك: ' + score, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('المس الشاشة لتعيد اللعب', canvas.width / 2, canvas.height / 2 + 60);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
